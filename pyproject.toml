[project]
name = "natsrpy"
description = "Nats client library written in rust"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
  "Topic :: System :: Networking",
]
dependencies = [
  "maturin-import-hook>=0.3.0",
  "typing-extensions>=4.14.0",
]
dynamic = ["version"]

[[project.authors]]
name = "Pavel Kirilin"
email = "s3riussan@gmail.com"

[project.entry-points.opentelemetry_instrumentor]
natsrpy = "natsrpy.instrumentation:NatsrpyInstrumentor"

[project.optional-dependencies]
opentelemetry = [
  "opentelemetry-api (>=1.38.0,<2.0.0)",
  "opentelemetry-instrumentation (>=0.59b0,<1)",
  "opentelemetry-semantic-conventions (>=0.59b0,<1)",
]

[dependency-groups]
dev = [
  "anyio>=4,<5",
  "maturin>=1,<2",
  "mypy>=1.19.1,<2",
  "pre-commit>=4.5.1,<5",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "pytest-xdist>=3,<4",
]

[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module"]
module-name = "natsrpy._natsrpy_rs"
python-source = "python"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
packages = ["natsrpy"]
pretty = true
implicit_reexport = true
allow_untyped_decorators = true
namespace_packages = true
warn_return_any = false

[tool.pytest]
anyio_mode = "auto"

[tool.coverage.run]
omit = [
	"python/tests/**/*",
	"python/natsrpy/instrumentation/**/*",
]

[tool.ruff]
target-version = "py310"
exclude = [".venv/"]
line-length = 88

[tool.ruff.lint]
mccabe = { max-complexity = 10 }
# List of enabled rulsets.
# See https://docs.astral.sh/ruff/rules/ for more information.
select = [
  "E",  # Error
  "F",  # Pyflakes
  "W",  # Pycodestyle
  "C90",  # McCabe complexity
  "I",  # Isort
  "N",  # pep8-naming
  "D",  # Pydocstyle
  "ANN",  # Pytype annotations
  "S",  # Bandit
  "B",  # Bugbear
  "COM",  # Commas
  "C4",  # Comprehensions
  "ISC",  # Implicit string concat
  "PIE",  # Unnecessary code
  "T20",  # Catch prints
  "PYI",  # validate pyi files
  "Q",  # Checks for quotes
  "RSE",  # Checks raise statements
  "RET",  # Checks return statements
  "SLF",  # Self checks
  "SIM",  # Simplificator
  "PTH",  # Pathlib checks
  "ERA",  # Checks for commented out code
  "PL",  # PyLint checks
  "RUF",  # Specific to Ruff checks
  "UP",  # Pyupgrade
]
ignore = [
  "D105",  # Missing docstring in magic method
  "D107",  # Missing docstring in __init__
  "D212",  # Multi-line docstring summary should start at the first line
  "D401",  # First line should be in imperative mood
  "D104",  # Missing docstring in public package
  "D100",  # Missing docstring in public module
  "ANN401",  # typing.Any are disallowed in `**kwargs
  "PLR0913",  # Too many arguments for function call
  "D106",  # Missing docstring in public nested class
  "PYI021",  # Docstrings should not be included in stubs
]

[tool.ruff.lint.per-file-ignores]
"python/tests/*" = [
  "S101",  # Use of assert detected
  "S301",  # Use of pickle detected
  "D103",  # Missing docstring in public function
  "SLF001",  # Private member accessed
  "S311",  # Standard pseudo-random generators are not suitable for security/cryptographic purposes
  "D101",  # Missing docstring in public class
  "PLR2004",  # Magic value used in comparison
  "B017",  # Do not assert blind exception
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float"]

[tool.uv]
package = false
